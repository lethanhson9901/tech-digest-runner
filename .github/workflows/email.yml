name: Email Daily

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/generate-config
        with:
          aiclient2api_url: ${{ secrets.AICLIENT2API_URL }}
          aiclient2api_key: ${{ secrets.AICLIENT2API_KEY }}
          mongodb_uri: ${{ secrets.MONGODB_URI }}
          gmail_app_password: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Run email workflow
        # No --email-only flag: matches original k8s behavior (default entrypoint runs email job).
        # Verify image entrypoint if unexpected jobs run.
        run: |
          docker run --rm \
            -v /tmp/td-config:/app/config:ro \
            sonlt173346hust/tech-digest-workflow@sha256:4b79fb6fa1b628c4792c999ecd47562d1b50973e985f8d5c92587a75f25c4712 \
            --llm-provider custom_llm \
            --max-workers 5
