name: HackerNews Daily

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/generate-config
        with:
          aiclient2api_url: ${{ secrets.AICLIENT2API_URL }}
          aiclient2api_key: ${{ secrets.AICLIENT2API_KEY }}
          mongodb_uri: ${{ secrets.MONGODB_URI }}

      - name: Run hackernews workflow
        run: |
          docker run --rm \
            -v /tmp/td-config:/app/config:ro \
            sonlt173346hust/tech-digest-workflow:latest \
            --hackernews-only \
            --llm-provider custom_llm \
            --max-workers 5
