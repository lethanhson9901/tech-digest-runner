name: Product Hunt Daily

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/generate-config
        with:
          aiclient2api_url: ${{ secrets.AICLIENT2API_URL }}
          aiclient2api_key: ${{ secrets.AICLIENT2API_KEY }}
          mongodb_uri: ${{ secrets.MONGODB_URI }}
          producthunt_token: ${{ secrets.PRODUCTHUNT_TOKEN }}

      - name: Run producthunt workflow
        run: |
          docker run --rm \
            -v /tmp/td-config:/app/config:ro \
            sonlt173346hust/tech-digest-workflow@sha256:06e5c54387c1c4be0947b0bfad4f890270a205544613488e112be0f3f40f8b33 \
            --producthunt-only \
            --llm-provider custom_llm \
            --max-workers 5
