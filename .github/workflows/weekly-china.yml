name: Weekly China News

on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: ./.github/actions/generate-config
        with:
          aiclient2api_url: ${{ secrets.AICLIENT2API_URL }}
          aiclient2api_key: ${{ secrets.AICLIENT2API_KEY }}
          mongodb_uri: ${{ secrets.MONGODB_URI }}

      - name: Run weekly-china workflow
        run: |
          docker run --rm \
            -v /tmp/td-config:/app/config:ro \
            sonlt173346hust/tech-digest-workflow@sha256:8d888f0c7cbb0ddf7b5249f312c5b1e318628be666ff16ae1f3f71bee4677e75 \
            --ai-news-only \
            --llm-provider custom_llm \
            --max-workers 5
